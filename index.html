<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0066CC" />
    <meta name="description" content="KaziApa — Your local market, online. Buy, sell, find jobs and housing near you across Kenya." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KaziApa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://dalaawxoiecrmfwxwrdn.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://dalaawxoiecrmfwxwrdn.supabase.co" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>KaziApa — Soko lako la karibu</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #0066CC; overscroll-behavior-y: none; }
      body {
        overscroll-behavior-y: none;
        background: #0066CC;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; }
      .ka-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0066CC; color: #fff; }
      .ka-boot-logo { width: 84px; height: 84px; border-radius: 22px; background: #F5A623; color: #0066CC; font-size: 46px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
      .ka-boot-name { font-size: 30px; font-weight: 900; margin-top: 18px; letter-spacing: -0.5px; }
      .ka-boot-dots { display: flex; gap: 8px; margin-top: 34px; }
      .ka-boot-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.45); animation: kaBoot 1.2s ease-in-out infinite; }
      .ka-boot-dots i:nth-child(2) { animation-delay: .2s; }
      .ka-boot-dots i:nth-child(3) { animation-delay: .4s; }
      @keyframes kaBoot { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
      @media (prefers-reduced-motion: reduce) { .ka-boot-dots i { animation: none; } }
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ka-boot" role="status" aria-label="Loading KaziApa">
        <div class="ka-boot-logo">K</div>
        <div class="ka-boot-name">KaziApa</div>
        <div class="ka-boot-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('KaziApa SW registered'))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
