<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M-Pesa STK Push Test</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 24px;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #666; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-top: 16px; margin-bottom: 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
  }
  button:disabled { background: #999; }
  #result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .success { background: #d1f7d6; color: #14532d; display: block !important; }
  .error { background: #ffe0e0; color: #7a1212; display: block !important; }
</style>
</head>
<body>

<h1>STK Push Test</h1>
<p class="subtitle">Sandbox only — no real money moves. Use the Safaricom test number below.</p>

<label for="endpoint">Your site URL</label>
<input id="endpoint" value="https://kaziapa.co.ke" />

<label for="phone">Phone number</label>
<input id="phone" value="254708374149" />

<label for="amount">Amount</label>
<input id="amount" value="10" type="number" />

<label for="ref">Account reference</label>
<input id="ref" value="TEST-001" />

<button id="sendBtn" onclick="sendStkPush()">Send STK Push</button>

<div id="result"></div>

<script>
async function sendStkPush() {
  const btn = document.getElementById('sendBtn');
  const resultDiv = document.getElementById('result');
  const endpoint = document.getElementById('endpoint').value.trim().replace(/\/$/, '');
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value.trim();
  const ref = document.getElementById('ref').value.trim();

  btn.disabled = true;
  btn.textContent = 'Sending...';
  resultDiv.className = '';
  resultDiv.style.display = 'none';

  try {
    const res = await fetch(`${endpoint}/api/mpesa-stk-push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone,
        amount,
        accountReference: ref,
        transactionDesc: 'STK Push test'
      })
    });

    const data = await res.json();
    resultDiv.className = data.success ? 'success' : 'error';
    resultDiv.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    resultDiv.className = 'error';
    resultDiv.textContent = 'Request failed: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send STK Push';
  }
}
</script>

</body>
</html>
